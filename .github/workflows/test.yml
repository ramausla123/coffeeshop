name: Automated tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm --workspace=coffee-backend run build

      - name: Build frontend
        run: npm --workspace=coffee-frontend run build

      - name: Smoke test backend health
        run: |
          node -e "const http=require('http'); const req=http.get('http://127.0.0.1:4000/health', res=>{console.log('status',res.statusCode); process.exit(res.statusCode===200?0:1)}); req.on('error', err=>{console.error(err); process.exit(1)});"
