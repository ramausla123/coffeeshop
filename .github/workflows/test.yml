name: Automated tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      PORT: 4000
      JWT_SECRET: test-secret
      DEFAULT_ADMIN_PASSWORD: admin-test
      DEFAULT_KITCHEN_PASSWORD: kitchen-test
      DEFAULT_CASHIER_PASSWORD: cashier-test
      DB_TYPE: sqlite
      DB_PATH: ./coffee-test.db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm --workspace=coffee-backend run build

      - name: Build frontend
        run: npm --workspace=coffee-frontend run build

      - name: Start backend
        run: |
          npm --workspace=coffee-backend run start > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid

      - name: Wait for backend health
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4000/health >/tmp/health.json 2>/dev/null; then
              echo "Backend is healthy"
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy"
          cat /tmp/backend.log
          exit 1

      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/backend.pid ]; then
            kill $(cat /tmp/backend.pid) || true
          fi
